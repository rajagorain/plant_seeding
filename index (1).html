<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rooted – grow a tree while you focus</title>
<meta name="description" content="A focus timer where a tree grows while you work. Leave the tab and it withers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mist: #E4EDE8;
    --sky: #BFD9E3;
    --ink: #1F2D3A;
    --muted: #546472;
    --leaf: #3F7D4B;
    --bloom: #E8718D;
    --line: #C3D1CA;
    --display: "Young Serif", Georgia, serif;
    --ui: "Figtree", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--mist); color: var(--ink);
    font-family: var(--ui); font-size: 1rem; line-height: 1.5;
  }
  button { font: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--bloom); outline-offset: 3px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 1.25rem; }

  header { padding: 1.25rem 0; }
  header .wrap { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .logo { font-family: var(--display); font-size: 1.6rem; margin: 0; }
  .stats { color: var(--muted); font-size: .95rem; }

  .scene {
    background: var(--sky); border-radius: 20px; overflow: hidden;
    border: 2px solid var(--ink);
  }
  .scene svg { display: block; width: 100%; height: auto; }

  .panel { text-align: center; padding: 1.5rem 0 1rem; }
  .time {
    font-family: var(--display); font-size: clamp(3.5rem, 18vw, 5.5rem);
    line-height: 1; margin: 0; font-variant-numeric: tabular-nums;
  }
  .msg { min-height: 3em; color: var(--muted); max-width: 44ch; margin: .75rem auto 1.25rem; }

  .chips { display: flex; justify-content: center; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .chip {
    background: transparent; color: var(--ink); border: 2px solid var(--ink);
    border-radius: 999px; padding: .5rem 1.1rem; font-weight: 500; min-height: 44px;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--mist); }
  .chip:disabled { opacity: .45; cursor: not-allowed; }

  .go {
    background: var(--leaf); color: #fff; border: 0; border-radius: 12px;
    padding: .9rem 2.2rem; font-weight: 700; font-size: 1.1rem; min-height: 52px;
  }
  .go:hover { background: #2F6B45; }
  .go.quit { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
  .go.quit:hover { background: var(--ink); color: var(--mist); }

  .forest { margin-top: 2.5rem; padding: 2rem 0 3rem; border-top: 2px solid var(--line); }
  .forest-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1rem; }
  .forest h2 { font-family: var(--display); font-weight: 400; font-size: 1.5rem; margin: 0; }
  .link { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: .25rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: .5rem; }
  .grid .cell { background: var(--sky); border-radius: 10px; overflow: hidden; }
  .grid svg { display: block; width: 100%; height: auto; }
  .empty { color: var(--muted); margin: 0; }
  .note { color: var(--muted); font-size: .9rem; margin-top: 1.5rem; }
  noscript { display: block; padding: 1rem; text-align: center; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1 class="logo">Rooted</h1>
    <div class="stats" id="stats" aria-live="polite"></div>
  </div>
</header>

<main class="wrap">
  <noscript>Rooted needs JavaScript to run the timer.</noscript>

  <div class="scene"><svg id="scene" viewBox="0 0 400 300" role="img" aria-label="A tree growing as your focus timer runs"></svg></div>

  <div class="panel">
    <p class="time" id="time" role="timer">25:00</p>
    <p class="msg" id="msg" aria-live="polite"></p>
    <div class="chips" id="chips" role="group" aria-label="Session length">
      <button class="chip" data-min="1">1 min (try it)</button>
      <button class="chip" data-min="10">10 min</button>
      <button class="chip" data-min="25" aria-pressed="true">25 min</button>
      <button class="chip" data-min="45">45 min</button>
    </div>
    <button class="go" id="go">Plant a seed</button>
  </div>

  <section class="forest" aria-labelledby="fh">
    <div class="forest-head">
      <h2 id="fh">Your forest</h2>
      <button class="link" id="clear" hidden>Clear forest</button>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty">No trees yet. Finish a session to plant your first one.</p>
    <p class="note">Stay on this tab while the tree grows. Leaving for more than 10 seconds withers it.</p>
  </section>
</main>

<script>
(function () {
  var D = 7;                       // branch depth
  var GRACE_MS = 10000;            // time you may leave the tab
  var KEY = 'rooted:forest';
  var LEAVES = ['#3F7D4B', '#5FA05A', '#2F6B45'];

  function rng(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function buildTree(seed) {
    var r = rng(seed), segs = [];
    (function grow(x, y, ang, len, d) {
      var x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
      segs.push({ x: x, y: y, x2: x2, y2: y2, d: d });
      if (d >= D) return;
      var n = d === 0 ? 1 : (r() < 0.85 ? 2 : 1);
      for (var i = 0; i < n; i++) {
        var side = n === 1 ? (r() < 0.5 ? -1 : 1) : (i === 0 ? -1 : 1);
        var dev = (12 + r() * 22) * Math.PI / 180 * side;
        grow(x2, y2, ang + dev, len * (0.76 + r() * 0.06), d + 1);
      }
    })(200, 260, -Math.PI / 2, 52, 0);
    return segs;
  }

  function f1(n) { return n.toFixed(1); }
  function clamp(v) { return Math.max(0, Math.min(1, v)); }

  function treeMarkup(segs, p, dead, bloom, wScale) {
    var phases = D + 1, lines = '', leaves = '', blooms = '';
    for (var i = 0; i < segs.length; i++) {
      var s = segs[i], f = clamp(p * phases - s.d);
      if (f <= 0) continue;
      var ex = s.x + (s.x2 - s.x) * f, ey = s.y + (s.y2 - s.y) * f;
      var w = (1.2 + (D - s.d) * 0.95) * wScale;
      lines += '<line x1="' + f1(s.x) + '" y1="' + f1(s.y) + '" x2="' + f1(ex) + '" y2="' + f1(ey) + '" stroke-width="' + f1(w) + '"/>';
      if (!dead && s.d >= D - 2) {
        var base = s.d === D ? 8 : 5;
        leaves += '<circle cx="' + f1(ex) + '" cy="' + f1(ey) + '" r="' + f1(base * f) + '" fill="' + LEAVES[i % 3] + '"/>';
      }
      if (bloom && s.d === D && i % 3 === 0) {
        blooms += '<circle cx="' + f1(ex + 3) + '" cy="' + f1(ey - 3) + '" r="3.2" fill="#E8718D"/>';
      }
    }
    var bark = dead ? '#8A8178' : '#5A4636';
    return '<g stroke="' + bark + '" stroke-linecap="round">' + lines + '</g><g>' + leaves + '</g><g>' + blooms + '</g>';
  }

  function scene(segs, p, dead, bloom) {
    var sx = 50 + 300 * p, sy = 85 - Math.sin(Math.PI * p) * 45;
    return '<circle cx="' + f1(sx) + '" cy="' + f1(sy) + '" r="20" fill="' + (dead ? '#D9D3C4' : '#F4C95D') + '"/>' +
      '<ellipse cx="200" cy="300" rx="260" ry="48" fill="#6FAF5B"/>' +
      '<ellipse cx="200" cy="268" rx="46" ry="9" fill="#4A3A30"/>' +
      treeMarkup(segs, p, dead, bloom, 1);
  }

  function mini(seed, dead) {
    return '<svg viewBox="0 0 400 300" aria-hidden="true"><ellipse cx="200" cy="300" rx="260" ry="48" fill="#6FAF5B"/>' +
      treeMarkup(buildTree(seed), 1, dead, !dead, 1.7) + '</svg>';
  }

  // ---------- storage (wrapped: it can be unavailable) ----------
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
  function save(list) { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} }

  // ---------- elements ----------
  var $ = function (id) { return document.getElementById(id); };
  var elScene = $('scene'), elTime = $('time'), elMsg = $('msg'), elGo = $('go'),
      elChips = $('chips'), elGrid = $('grid'), elEmpty = $('empty'), elStats = $('stats'), elClear = $('clear');

  var minutes = 25, state = 'idle', segs = buildTree(1), seed = 1;
  var endAt = 0, total = 0, awayAt = 0, timer = null;

  function fmt(ms) {
    var s = Math.max(0, Math.ceil(ms / 1000)), m = Math.floor(s / 60);
    return (m < 10 ? '0' : '') + m + ':' + (s % 60 < 10 ? '0' : '') + (s % 60);
  }

  function renderForest() {
    var list = load(), grown = 0, mins = 0, html = '';
    list.forEach(function (t) { if (!t.dead) { grown++; mins += t.min; } });
    list.slice(-30).reverse().forEach(function (t) {
      html += '<div class="cell" title="' + (t.dead ? 'Withered' : t.min + ' min') + '">' + mini(t.seed, t.dead) + '</div>';
    });
    elGrid.innerHTML = html;
    elEmpty.hidden = list.length > 0;
    elClear.hidden = list.length === 0;
    var h = Math.floor(mins / 60), m = mins % 60;
    elStats.textContent = grown + (grown === 1 ? ' tree' : ' trees') + ' · ' + (h ? h + 'h ' : '') + m + 'm focused';
  }

  function setChips(disabled) {
    Array.prototype.forEach.call(elChips.children, function (b) {
      b.disabled = disabled;
      b.setAttribute('aria-pressed', String(+b.dataset.min === minutes));
    });
  }

  function paint() {
    if (state === 'running') {
      var left = endAt - Date.now(), p = clamp(1 - left / total);
      elTime.textContent = fmt(left);
      document.title = fmt(left) + ' – Rooted';
      elScene.innerHTML = scene(segs, Math.max(p, 0.03), false, false);
    }
  }

  function idle() {
    state = 'idle'; clearInterval(timer);
    seed = Math.floor(Math.random() * 1e9); segs = buildTree(seed);
    elTime.textContent = fmt(minutes * 60000);
    elScene.innerHTML = scene(segs, 0.03, false, false);
    elMsg.textContent = 'Pick a length and plant a seed. Stay on this tab until it has grown.';
    elGo.textContent = 'Plant a seed'; elGo.className = 'go';
    document.title = 'Rooted – grow a tree while you focus';
    setChips(false);
  }

  function start() {
    state = 'running'; total = minutes * 60000; endAt = Date.now() + total; awayAt = 0;
    elMsg.textContent = 'Growing. Leaving this tab for more than 10 seconds will wither the tree.';
    elGo.textContent = 'Give up'; elGo.className = 'go quit';
    setChips(true);
    clearInterval(timer); timer = setInterval(tick, 250); paint();
  }

  function tick() {
    if (state !== 'running') return;
    if (Date.now() >= endAt) finish(); else paint();
  }

  function record(dead) {
    var list = load(); list.push({ seed: seed, min: minutes, dead: dead, t: Date.now() });
    save(list.slice(-200)); renderForest();
  }

  function finish() {
    state = 'done'; clearInterval(timer);
    elTime.textContent = '00:00';
    elScene.innerHTML = scene(segs, 1, false, true);
    elMsg.textContent = 'Fully grown. ' + minutes + ' minutes added to your forest.';
    elGo.textContent = 'Plant another'; elGo.className = 'go';
    document.title = 'Done – Rooted'; setChips(false);
    record(false);
  }

  function wither(reason) {
    state = 'dead'; clearInterval(timer);
    var p = clamp(1 - (endAt - Date.now()) / total);
    elScene.innerHTML = scene(segs, Math.max(p, 0.03), true, false);
    elMsg.textContent = reason + ' Plant another when you are ready.';
    elGo.textContent = 'Plant another'; elGo.className = 'go';
    document.title = 'Withered – Rooted'; setChips(false);
    record(true);
  }

  elGo.addEventListener('click', function () {
    if (state === 'idle') start();
    else if (state === 'running') wither('You gave up on this one.');
    else { idle(); }
  });

  elChips.addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b || b.disabled) return;
    minutes = +b.dataset.min; setChips(false);
    if (state === 'idle') elTime.textContent = fmt(minutes * 60000);
  });

  document.addEventListener('visibilitychange', function () {
    if (state !== 'running') return;
    if (document.hidden) awayAt = Date.now();
    else if (awayAt && Date.now() - awayAt > GRACE_MS) {
      wither('You left the tab for ' + Math.round((Date.now() - awayAt) / 1000) + ' seconds.');
    } else { awayAt = 0; }
  });

  elClear.addEventListener('click', function () {
    if (confirm('Remove all trees from your forest?')) { save([]); renderForest(); }
  });

  renderForest(); idle();
})();
</script>
</body>
</html>
